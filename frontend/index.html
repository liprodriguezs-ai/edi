<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- `maximum-scale`/`user-scalable=no` bloquean el pinch-zoom en Android y en la
         PWA instalada. iOS Safari los ignora a propósito: ahí el bloqueo lo hace
         setupZoomLock() cancelando los eventos de gesto de WebKit. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>EDI | La administración de tu organización, en orden</title>
    <meta
      name="description"
      content="Cobranza, tesorería y transparencia de tu organización o organización en un solo lugar. EDI lo pone en orden — y lo mantiene así."
    />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta
      name="Permissions-Policy"
      content="camera=(), microphone=(), geolocation=(), payment=()"
    />
    <meta name="theme-color" content="#166534" />
    <meta name="color-scheme" content="light" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="EDI" />
    <!-- El manifest y el registro del service worker los inyecta vite-plugin-pwa en build. -->

    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      #splash .sp {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 3px solid #e5e5e5;
        border-top-color: #a3a3a3;
        animation: sp 0.7s linear infinite;
      }
      #splash p {
        font:
          14px system-ui,
          sans-serif;
        color: #737373;
        margin: 0;
      }
      #splash img {
        width: 64px;
        height: auto;
      }
      @keyframes sp {
        to {
          transform: rotate(360deg);
        }
      }

      /* When html gets .app-ready, hide splash via CSS — same paint cycle, zero flash */
      html.app-ready #splash {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icons/edi-mark.svg" alt="" />
      <div class="sp"></div>
      <p>Cargando...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
