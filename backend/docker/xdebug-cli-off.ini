; Intentionally empty: this file is mounted over the image's own
; /etc/php/8.4/cli/conf.d/20-xdebug.ini so the Xdebug extension is never loaded
; for CLI processes (tests, artisan, queue workers).
;
; `XDEBUG_MODE=off` — which compose.yaml already sets — only makes Xdebug
; inactive; the extension still loads and still overrides zend_execute_ex().
; Measured cost of the loaded-but-off extension on the bootstrap: median 1.99s
; with it vs 1.84s without (~9%, inside the measurement noise), so this is a
; small win, not the reason tests were slow.
;
; The web/FPM configuration is untouched on purpose — only the CLI conf.d entry
; is overridden here, so this does not change how the served application runs.
;
; To get Xdebug back for CLI debugging, comment out the corresponding mount in
; compose.yaml and run: docker compose up -d --force-recreate laravel.test
