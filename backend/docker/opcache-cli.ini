; OPcache tuning for CLI processes: tests, artisan commands and queue workers.
;
; The project root is bind-mounted from macOS into the container, and that mount
; is roughly 16x slower than the container's own filesystem (measured: 14.5s vs
; 0.9s to stat 5000 files). PHP ships with OPcache disabled for CLI, so every
; artisan/phpunit process re-read and re-compiled the entire codebase across that
; slow mount on each invocation — which is what made the test suite crawl.
;
; `file_cache` points at an internal Docker volume (NOT the bind mount) so the
; compiled bytecode persists between CLI processes and is read at native speed.
opcache.enable_cli=1
opcache.file_cache=/opcache
opcache.memory_consumption=512
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=50000

; Timestamp validation stays ON deliberately. Disabling it is measurably faster,
; but it makes PHP serve stale bytecode after a file is edited — meaning a test
; run could silently exercise the previous version of the code. A slow suite is
; an annoyance; a suite that lies about what it ran is a trap.
opcache.validate_timestamps=1
opcache.revalidate_freq=0

; Xdebug overrides zend_execute_ex(), which makes PHP emit a JIT-incompatibility
; warning on every CLI invocation once OPcache is enabled. The JIT cannot run
; alongside Xdebug anyway, so disable it explicitly and keep the output clean.
opcache.jit=disable
opcache.jit_buffer_size=0
